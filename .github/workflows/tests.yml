name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Check installed packages are consistent
        run: python -m pip check
      - name: Unit and API tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: for f in static/*.js; do node --check "$f"; done
